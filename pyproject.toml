[project]
name = "comfy-kaggle-app"
version = "0.1.0"
description = "FastAPI ComfyUI inference integration"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "pydantic-settings>=2.5", "uvicorn[standard]>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_kaggle_app"]

[tool.ruff]
line-length = 100
